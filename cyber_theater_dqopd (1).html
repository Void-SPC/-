<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>КИБЕР-ТЕАТР DQOPD — HTML5 Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #080812;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Consolas', monospace;
            color: #fff;
        }
        canvas {
            background-color: #080812;
            box-shadow: 0 0 20px rgba(63, 207, 255, 0.3);
            cursor: crosshair;
        }
        #click-to-start {
            position: absolute;
            background: rgba(8, 8, 18, 0.95);
            border: 2px solid #ffcf3f;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="click-to-start">
        <h2>КИБЕР-ТЕАТР DQOPD</h2>
        <p>Кликни сюда для активации аудиосистемы и запуска игры</p>
    </div>

    <canvas id="gameCanvas" width="1280" height="720"></canvas>

<script>
// ----------------------------------------------------------------------
//  ИНИЦИАЛИЗАЦИЯ И НАСТРОЙКИ Аудио
// ----------------------------------------------------------------------
let audioCtx = null;
const startOverlay = document.getElementById('click-to-start');

startOverlay.addEventListener('click', () => {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    startOverlay.style.display = 'none';
});

// Синтезатор звуков "на лету" (аналог make_tone)
function playTone(freq, duration, volume, type = 'square', slideTo = null) {
    if (!audioCtx) return;
    try {
        let osc = audioCtx.createOscillator();
        let gainNode = audioCtx.createGain();
        
        osc.type = type === 'noise' ? 'triangle' : type; // Нойс сэмулируем трианглом для простоты в один файл
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        if (slideTo) {
            osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
        }
        
        gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

const sfx = {
    laser: () => playTone(900, 0.10, 0.25, 'square', 220),
    bossHit: () => playTone(120, 0.18, 0.30, 'square', 50),
    bossCue: () => playTone(70, 0.35, 0.30, 'square', 30),
    step: () => playTone(150, 0.04, 0.15, 'triangle'),
    robotAtk: () => playTone(300, 0.12, 0.25, 'square', 150),
    good: () => playTone(500, 0.08, 0.25, 'square', 900),
    bad: () => playTone(200, 0.18, 0.25, 'square', 80),
    stun: () => playTone(1200, 0.25, 0.25, 'triangle', 100),
    portal: () => playTone(220, 0.6, 0.25, 'sine', 1200),
    notes: [261, 293, 329, 392, 440, 523, 587]
};

// ----------------------------------------------------------------------
//  ГЛОБАЛЬНЫЕ КОНСТАНТЫ И СОСТОЯНИЕ
// ----------------------------------------------------------------------
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const WIDTH = 1280;
const HEIGHT = 720;
const GROUND_Y = Math.floor(HEIGHT * 0.72);
const TILE = 64;
const LASER_RANGE = 620;
const LASER_SPEED = 15;
const ARENA_SCALE = 5.0;
const ARENA_R = Math.min(WIDTH, HEIGHT) * 0.30 * ARENA_SCALE;
const WORLD_START = -720;
const BATTLE_START = 0;
const WORLD_LENGTH = 9000;

const MACHINE_TIERS = [
    {tier: "basic",     cost: 15,  chance: 0.60, bmin: 5,  bmax: 15,  col: "#3fcfff"},
    {tier: "advanced",  cost: 50,  chance: 0.40, bmin: 20, bmax: 35,  col: "#bf3fff"},
    {tier: "legendary", cost: 150, chance: 0.20, bmin: 40, bmax: 70,  col: "#ffcf3f"}
];

let G = {
    state: "MENU",
    t: 0,
    bgMode: "curtain",
    bgTimer: 60.0,
    camX: 0,
    message: "",
    messageTimer: 0,
    cardPopup: null,
    battleActive: false,
    arenaDarkness: 0,
    screenShake: 0,
    endText: "",
    endAlpha: 0,
    musicTimer: 0,
    robots: [],
    islands: [],
    lasers: [],
    enemyProj: [],
    acidPool: [],
    particles: [],
    obstacles: [],
    vents: [],
    miniCopies: [],
    portals: [],
    player: {
        x: WORLD_START + 60, y: 0, w: 46, h: 62, vy: 0, hopY: 0,
        onGround: true, jumpsLeft: 1, hp: 100, maxHp: 100, dmg: 14,
        speed: 3.6, facing: 1, omp: 0, fireCd: 0, poisonTimer: 0,
        ax: 0, ay: 0
    },
    boss: null
};

// Ввод
let keys = {};
let mousePressed = false;
window.addEventListener('keydown', e => { 
    keys[e.code] = true; 
    if(e.code === 'Space') I.jumpPressed = true;
    if(e.code === 'KeyE') I.interact = true;
    if(e.code === 'Escape' && (G.state === "LORE" || G.state === "SETTINGS")) G.state = "MENU";
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('mousedown', e => { if(e.button === 0) mousePressed = true; });
window.addEventListener('mouseup', e => { if(e.button === 0) mousePressed = false; });

let I = { x: 0, y: 0, fire: false, interact: false, jumpPressed: false, facing: 1 };

function pollInput() {
    I.x = 0; I.y = 0;
    if (keys['KeyA'] || keys['ArrowLeft']) I.x -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) I.x += 1;
    if (keys['KeyW'] || keys['ArrowUp']) I.y -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) I.y += 1;
    if (I.x !== 0) I.facing = I.x > 0 ? 1 : -1;
    I.fire = keys['KeyF'] || mousePressed;
}

// ----------------------------------------------------------------------
//  УТИЛИТЫ КЛЭМПА И ОТРИСОВКИ
// ----------------------------------------------------------------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function showMessage(txt, sec) {
    G.message = txt;
    G.messageTimer = sec;
}

function drawText(txt, size, color, x, y, center = false, isBold = true) {
    ctx.fillStyle = "#000000";
    ctx.font = `${isBold ? 'bold ' : ''}${size}px Consolas`;
    ctx.textAlign = center ? "center" : "left";
    ctx.fillText(txt, x + 2, y + 2); // Тень
    ctx.fillStyle = color;
    ctx.fillText(txt, x, y);
}

function drawVGradient(x, y, w, h, topC, botC, radius = 0) {
    if (w <= 0 || h <= 0) return;
    ctx.save();
    if (radius > 0) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
        ctx.clip();
    }
    let grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, topC);
    grad.addColorStop(1, botC);
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);
    ctx.restore();
}

// ----------------------------------------------------------------------
//  ГЕНЕРАЦИЯ МИРОВ И ОБЪЕКТОВ
// ----------------------------------------------------------------------
function generatePath() {
    G.robots = []; G.islands = []; G.lasers = []; G.enemyProj = []; G.acidPool = []; G.particles = [];
    G.battleActive = false;
    
    let x = BATTLE_START + 500;
    let kinds = ["skeleton", "barman", "dancer", "clown", "ballerina"];
    while (x < WORLD_LENGTH - 400) {
        let kind = kinds[Math.floor(Math.random() * kinds.length)];
        let hpMap = {skeleton: 35, barman: 10, dancer: 33, clown: 25, ballerina: 30};
        let speedMap = {dancer: 2.4, ballerina: 0.8, clown: 2.0, barman: 1.0, skeleton: 1.3};
        G.robots.push({
            x: x, y: 0, w: 40, h: 54, vx: 0, vy: 0, kind: kind,
            hp: hpMap[kind], maxHp: hpMap[kind], dead: false, fade: 0,
            attackCd: 0, stepCd: Math.random(), jumpCd: Math.random() * 2, grounded: true,
            baseSpeed: speedMap[kind]
        });
        x += 240 + Math.random() * 180;
    }

    for (let i = 0; i < 4; i++) {
        let ix = 1800 + i * 2200;
        let machines = MACHINE_TIERS.map((tier, idx) => ({
            ...tier, ox: (idx - 1) * 90, oy: 10, cooldown: 0
        }));
        G.islands.push({ x: ix, y: 0, rx: 180, ry: 100, domeOn: false, machines: machines });
    }
    
    G.player.x = WORLD_START + 60; G.player.y = 0; G.player.omp = 0; G.player.hp = G.player.maxHp;
}

function generateArena() {
    G.robots = []; G.lasers = []; G.miniCopies = []; G.enemyProj = []; G.acidPool = []; G.particles = [];
    G.obstacles = []; G.vents = []; G.portals = [];
    G.arenaDarkness = 0; G.screenShake = 0;
    
    G.boss = {
        x: 0, y: 0, w: 90, h: 130, hp: 900, maxHp: 900, phaseIdx: 0,
        stunTimer: 0, attackTimer: 3.0, currentAttack: null, alive: true,
        dodgeCd: 0, targetX: 0, targetY: 0, moveTimer: 1.0, seismicTelegraph: 0, successFaceTimer: 0
    };
    
    G.player.ax = 0; G.player.ay = 0; G.player.hp = G.player.maxHp;

    for(let i=0; i<8; i++) {
        let ang = (i / 8) * Math.PI * 2 + (Math.random() * 0.2 - 0.1);
        let dist = 100 + Math.random() * (ARENA_R * 0.45);
        G.obstacles.push({ x: Math.cos(ang)*dist, y: Math.sin(ang)*dist, w: 56, h: 56 });
    }
    for(let i=0; i<6; i++) {
        let ang = (i / 6) * Math.PI * 2 + Math.PI / 6;
        G.vents.push({ x: Math.cos(ang) * ARENA_R * 0.42, y: Math.sin(ang) * ARENA_R * 0.42, r: 34, active: false, timer: 0 });
    }
}

function spawnBurst(x, y, color, n = 16) {
    for (let i = 0; i < n; i++) {
        G.particles.push({
            x: x, y: y,
            vx: (Math.random() * 8 - 4), vy: (Math.random() * 8 - 4),
            life: 0.35 + Math.random() * 0.35, color: color
        });
    }
}

function tryUseMachine(m, mx, my) {
    if (G.cardPopup) return;
    if (m.cooldown > 0) { showMessage("АВТОМАТ ПЕРЕЗАРЯЖАЕТСЯ", 1.0); return; }
    if (G.player.omp < m.cost) { sfx.bad(); showMessage("НЕДОСТАТОЧНО ОМП!", 1.0); return; }
    
    G.player.omp -= m.cost;
    m.cooldown = 20.0;
    G.cardPopup = { machine: m, timer: 1.6, stage: "spin", spinT: 0, success: null, bonus: 0, worldPos: [mx, my] };
}

function resolveCardPopup(dt) {
    let pop = G.cardPopup;
    if (!pop) return;
    pop.spinT += dt;
    if (pop.stage === "spin" && pop.spinT > 0.9) {
        pop.stage = "result";
        pop.success = Math.random() < pop.machine.chance;
        if (pop.success) {
            pop.bonus = pop.machine.bmin + Math.random() * (pop.machine.bmax - pop.machine.bmin);
            let tier = pop.machine.tier;
            if (tier === "basic") {
                G.player.hp = Math.min(G.player.maxHp, G.player.hp + 25);
                showMessage(`КАРТА ВЫИГРАНА: +25 ХП (${pop.bonus.toFixed(0)}%)`, 1.6);
            } else if (tier === "advanced") {
                G.player.dmg += 4;
                showMessage(`КАРТА ВЫИГРАНА: УРОН +4 (${pop.bonus.toFixed(0)}%)`, 1.6);
            } else {
                G.player.maxHp += 30; G.player.hp += 30;
                showMessage(`ЛЕГЕНДАРНАЯ КАРТА: МАКС.ХП +30 (${pop.bonus.toFixed(0)}%)`, 1.6);
            }
            sfx.good();
        } else {
            showMessage("КАРТА СГОРЕЛА. ОСКОЛКИ ПОТЕРЯНЫ.", 1.4);
            sfx.bad();
        }
        pop.timer = 1.6;
    }
    if (pop.stage === "result") {
        pop.timer -= dt;
        if (pop.timer <= 0) G.cardPopup = null;
    }
}

// ----------------------------------------------------------------------
//  ОБНОВЛЕНИЕ ЛОГИКИ ТРОПЫ И АРЕНЫ
// ----------------------------------------------------------------------
function updateMusic(dt) {
    G.musicTimer -= dt;
    if (G.musicTimer <= 0) {
        let f = sfx.notes[Math.floor(Math.random() * sfx.notes.length)];
        playTone(f, 0.16, 0.05, 'square');
        G.musicTimer = 0.22;
    }
}

function updatePath(dt) {
    let p = G.player;
    if (G.cardPopup) resolveCardPopup(dt);
    
    let nextX = p.x + I.x * p.speed * 1.6;
    let nextY = p.y + I.y * p.speed * 1.6;
    
    let onIsland = null;
    for (let isl of G.islands) {
        if (Math.abs(nextX - isl.x) < isl.rx && Math.abs(nextY - isl.y) < isl.ry) {
            onIsland = isl; break;
        }
    }
    
    if (onIsland) { p.x = nextX; p.y = nextY; }
    else { p.x = nextX; p.y += (0 - p.y) * 0.2; }
    
    p.x = clamp(p.x, WORLD_START + 20, WORLD_LENGTH - 20);
    G.camX = clamp(p.x - WIDTH * 0.35, WORLD_START - 40, WORLD_LENGTH - WIDTH);

    if (p.x >= BATTLE_START && !G.battleActive) {
        G.battleActive = true;
        showMessage("ВНИМАНИЕ: ТЕАТРАЛЬНЫЕ КУКЛЫ АКТИВИРОВАНЫ", 2.0);
    }

    if (I.jumpPressed) {
        if (p.jumpsLeft > 0) { p.vy = -9.5; p.onGround = false; p.jumpsLeft--; }
        I.jumpPressed = false;
    }
    p.vy += 0.5; p.hopY += p.vy;
    if (p.hopY >= 0) { p.hopY = 0; p.vy = 0; p.onGround = true; p.jumpsLeft = 1; }

    if (I.interact && onIsland && !G.cardPopup) {
        let used = false;
        for (let m of onIsland.machines) {
            let mx = onIsland.x + m.ox, my = onIsland.y + m.oy;
            if (Math.hypot(p.x - mx, p.y - my) < 46 && m.cooldown <= 0) {
                tryUseMachine(m, mx, my); used = true; break;
            }
        }
        if (!used) {
            onIsland.domeOn = !onIsland.domeOn;
            showMessage("ЗАЩИТНЫЙ КУПОЛ " + (onIsland.domeOn ? "АКТИВИРОВАН" : "ДЕАКТИВИРОВАН"), 1.4);
        }
        I.interact = false;
    }

    for (let isl of G.islands) {
        for (let m of isl.machines) { if (m.cooldown > 0) m.cooldown -= dt; }
    }

    if (I.fire && p.fireCd <= 0) {
        G.lasers.push({ x: p.x, y: p.y - 12, startX: p.x, dir: I.facing, dead: false });
        sfx.laser(); p.fireCd = 0.18;
    }
    if (p.fireCd > 0) p.fireCd -= dt;
    for (let l of G.lasers) {
        l.x += l.dir * LASER_SPEED;
        if (Math.abs(l.x - l.startX) > LASER_RANGE) l.dead = true;
    }
    G.lasers = G.lasers.filter(l => !l.dead);

    for (let pr of G.enemyProj) {
        pr.x += pr.vx; pr.y += pr.vy; pr.vy += 0.25; pr.life -= dt;
        if (pr.y >= 0 || pr.life <= 0) { G.acidPool.push({ x: pr.x, y: 0, r: 40, life: 4.0 }); pr.dead = true; }
    }
    G.enemyProj = G.enemyProj.filter(pr => !pr.dead);

    for (let pool of G.acidPool) {
        pool.life -= dt;
        if (Math.abs(p.x - pool.x) < pool.r && Math.abs(p.y - pool.y) < 30) { p.hp -= 3.0 * dt; p.poisonTimer = 1.2; }
    }
    G.acidPool = G.acidPool.filter(a => a.life > 0);

    if (G.battleActive) {
        for (let r of G.robots) {
            if (r.dead) continue;
            let withinDome = null;
            for (let isl of G.islands) {
                if (Math.abs(r.x - isl.x) < isl.rx + 10 && isl.domeOn) { withinDome = isl; break; }
            }
            if (withinDome) { r.x += (r.x < withinDome.x) ? -4 : 4; continue; }

            let buffedDancer = G.robots.some(d => !d.dead && d.kind === "dancer" && Math.abs(d.x - r.x) < 300);
            let buffedClown = G.robots.some(c => !c.dead && c.kind === "clown" && Math.abs(c.x - r.x) < 300);
            let speed = r.baseSpeed * (buffedDancer ? 1.3 : 1.0);
            let dist = p.x - r.x;

            if (r.kind === "barman") {
                if (Math.abs(dist) > 220 && Math.abs(dist) < 500) {
                    r.vx = 0; r.attackCd -= dt;
                    if (r.attackCd <= 0) {
                        G.enemyProj.push({ x: r.x, y: -40, vx: dist * 0.02, vy: -7, dmg: 6, life: 3.0, dead: false });
                        r.attackCd = 1.8;
                    }
                } else if (Math.abs(dist) <= 220) { r.vx = dist !== 0 ? -Math.sign(dist) * speed : speed; }
                else { r.vx = dist !== 0 ? Math.sign(dist) * speed : speed; }
            } else if (r.kind === "clown") {
                r.jumpCd -= dt;
                if (r.grounded && r.jumpCd <= 0 && Math.abs(dist) < 400) { r.vy = -10; r.grounded = false; r.jumpCd = 1.5 + Math.random() * 1.0; }
                r.vy += 0.4; r.y += r.vy;
                if (r.y >= 0) { r.y = 0; r.vy = 0; r.grounded = true; }
                r.vx = dist !== 0 ? Math.sign(dist) * speed : speed;
            } else {
                if (Math.abs(dist) < 450) {
                    r.vx = dist !== 0 ? Math.sign(dist) * speed : speed;
                    r.stepCd -= dt;
                    if (r.stepCd <= 0 && r.grounded) { sfx.step(); r.stepCd = 0.4; }
                } else { r.vx = 0; }
            }

            r.x += r.vx; r.attackCd -= dt;
            if (Math.abs(dist) < 36 && Math.abs(p.y - r.y) < 35 && r.attackCd <= 0) {
                let mult = buffedClown ? 1.4 : 1.0;
                let dmgMap = {ballerina: 3.0, dancer: 6.0, clown: 5.0, barman: 4.0, skeleton: 8.0};
                let cdMap = {ballerina: 0.5, dancer: 1.4, clown: 1.1, barman: 1.6, skeleton: 1.6};
                p.hp -= dmgMap[r.kind] * mult; sfx.robotAtk(); r.attackCd = cdMap[r.kind];
            }
        }

        for (let l of G.lasers) {
            for (let r of G.robots) {
                if (!r.dead && Math.abs(l.x - r.x) < 30 && Math.abs(l.y - (r.y - 15)) < 40) {
                    r.hp -= p.dmg; l.dead = true;
                    if (r.hp <= 0) { r.dead = true; p.omp += 15 + Math.floor(Math.random() * 10); spawnBurst(r.x, r.y - 25, "#9696a0"); }
                }
            }
        }
    }

    for (let r of G.robots) { if (r.dead) r.fade++; }
    G.robots = G.robots.filter(r => !(r.dead && r.fade > 20));

    if (p.hp <= 0) { p.hp = p.maxHp; p.x = WORLD_START + 60; p.y = 0; showMessage("СИСТЕМЫ ПЕРЕЗАГРУЖЕНЫ. ПОПЫТКА СНАЧАЛА.", 2.0); }
    if (p.x > WORLD_LENGTH - 120) { G.state = "ARENA"; generateArena(); showMessage("ГРАНДИОЗНЫЙ КИБЕР-АНГАР: АРЕНА DQOPD", 2.5); }
}

function hitBoss(dmg) {
    let b = G.boss;
    if (b.stunTimer > 0) { b.hp -= dmg; sfx.bossHit(); spawnBurst(b.x, b.y, "#ff5555"); checkBossPhase(); return; }
    if (b.dodgeCd <= 0 && Math.random() < 0.20) {
        b.dodgeCd = 4.0; b.x += (Math.random() > 0.5 ? -110 : 110); b.y += (Math.random() > 0.5 ? -80 : 80);
        showMessage("DQOPD УКЛОНИЛСЯ!", 0.8);
    } else {
        b.hp -= dmg; sfx.bossHit(); spawnBurst(b.x, b.y, "#ff5555"); checkBossPhase();
    }
}

function checkBossPhase() {
    let b = G.boss; let pct = b.hp / b.maxHp;
    let target = pct > 0.75 ? 0 : pct > 0.5 ? 1 : pct > 0.25 ? 2 : pct > 0 ? 3 : 4;
    if (target > b.phaseIdx) { b.phaseIdx = target; b.stunTimer = 3.0; b.currentAttack = null; sfx.stun(); showMessage("DQOPD ОГЛУШЁН ГЛИТЧЕМ ТВ-ЭКРАНА!", 1.6); }
}

function startBossAttack() {
    let b = G.boss; let attacks = ["seismic", "summon", "gas", "darkness", "barrage"];
    let a = attacks[Math.floor(Math.random() * attacks.length)];
    b.currentAttack = a; sfx.bossCue();
    if (a === "seismic") b.seismicTelegraph = 1.2;
    else if (a === "gas") { for(let v of G.vents) { v.active = true; v.timer = 4.0; } showMessage("ВНИМАНИЕ: КЛАПАНЫ ВЕНТИЛЯЦИИ!", 1.4); }
    else if (a === "summon") {
        G.miniCopies.push({kind:"mini_clown", x:b.x-60, y:b.y+60, hp:15, maxHp:15, cd:0, noseCd:1.5, dead:false});
        G.miniCopies.push({kind:"mini_ballerina", x:b.x+60, y:b.y-60, hp:15, maxHp:15, cd:0, dead:false});
        G.miniCopies.push({kind:"mini_dancer", x:b.x, y:b.y+80, hp:15, maxHp:15, cd:0, healCd:2.0, dead:false});
        showMessage("DQOPD МАТЕРИАЛИЗОВАЛ МИНИ-КУКОЛ!", 1.6);
    } else if (a === "darkness") { G.arenaDarkness = 1.0; showMessage("СВЕТ ПОГАС! ЗАЖЖЕНЫ СВЕЧИ КИБЕР-ШОУ", 1.8); }
    else if (a === "barrage") {
        let p = G.player;
        for(let i=0; i<3; i++) {
            let ang = Math.atan2(p.ay - b.y, p.ax - b.x) + (Math.random()*0.6 - 0.3);
            G.enemyProj.push({ x:b.x, y:b.y, vx:Math.cos(ang)*6, vy:Math.sin(ang)*6, dmg:9, life:2.5, kind:"barrage", dead:false });
        }
        showMessage("DQOPD ОТКРЫВАЕТ ОГОНЬ!", 1.2);
    }
    b.attackTimer = 5 + Math.random() * 3;
}

function updateArena(dt) {
    let p = G.player; let b = G.boss; if(!b) return;
    if (b.successFaceTimer > 0) b.successFaceTimer -= dt;
    if (b.dodgeCd > 0) b.dodgeCd -= dt;

    let nextX = p.ax + I.x * p.speed * 1.4;
    let nextY = p.ay + I.y * p.speed * 1.4;
    for (let obs of G.obstacles) {
        if (Math.abs(nextX - obs.x) < obs.w/2 + 12 && Math.abs(nextY - obs.y) < obs.h/2 + 12) { nextX = p.ax; nextY = p.ay; }
    }
    p.ax = nextX; p.ay = nextY;
    
    let distC = Math.hypot(p.ax, p.ay);
    if (distC > ARENA_R - 40) { let ang = Math.atan2(p.ay, p.ax); p.ax = Math.cos(ang)*(ARENA_R - 40); p.ay = Math.sin(ang)*(ARENA_R - 40); }

    if (I.fire && p.fireCd <= 0) { G.lasers.push({ x: p.ax, y: p.ay, startX: p.ax, dir: I.facing, dead: false }); sfx.laser(); p.fireCd = 0.18; }
    if (p.fireCd > 0) p.fireCd -= dt;

    for (let l of G.lasers) {
        l.x += l.dir * LASER_SPEED;
        if (Math.abs(l.x - l.startX) > LASER_RANGE * ARENA_SCALE * 0.4) l.dead = true;
        for (let obs of G.obstacles) { if (Math.abs(l.x - obs.x) < obs.w/2 && Math.abs(l.y - obs.y) < obs.h/2) l.dead = true; }
        if (!l.dead && b.alive && Math.hypot(l.x - b.x, l.y - b.y) < 70) { l.dead = true; hitBoss(p.dmg); }
        for (let m of G.miniCopies) {
            if (!m.dead && !l.dead && Math.hypot(l.x - m.x, l.y - m.y) < 26) {
                l.dead = true; m.hp -= p.dmg; spawnBurst(m.x, m.y, "#ff9696");
                if (m.hp <= 0) { m.dead = true; p.omp += 8 + Math.floor(Math.random()*6); sfx.good(); }
            }
        }
    }
    G.lasers = G.lasers.filter(l => !l.dead);
    G.miniCopies = G.miniCopies.filter(m => !m.dead);

    for (let pr of G.enemyProj) {
        pr.x += pr.vx; pr.y += pr.vy; pr.life -= dt;
        if (Math.hypot(pr.x - p.ax, pr.y - p.ay) < 26) { p.hp -= pr.dmg; b.successFaceTimer = 1.0; pr.dead = true; }
        else if (pr.life <= 0 || Math.hypot(pr.x, pr.y) > ARENA_R + 80) pr.dead = true;
    }
    G.enemyProj = G.enemyProj.filter(pr => !pr.dead);

    if (b.stunTimer > 0) b.stunTimer -= dt;
    else if (b.alive) {
        b.attackTimer -= dt; if (b.attackTimer <= 0) startBossAttack();
        b.moveTimer -= dt;
        if (b.moveTimer <= 0) { b.targetX = p.ax + (Math.random()*440 - 220); b.targetY = p.ay + (Math.random()*440 - 220); b.moveTimer = 1.0 + Math.random()*1.5; }
        let bd = Math.hypot(b.targetX - b.x, b.targetY - b.y);
        if (bd > 20) { b.x += (b.targetX - b.x)/bd*3.0; b.y += (b.targetY - b.y)/bd*3.0; }
        
        if (b.currentAttack === "seismic" && b.seismicTelegraph > 0) {
            b.seismicTelegraph -= dt;
            if (b.seismicTelegraph <= 0) {
                G.screenShake = 2.0;
                let dist = Math.hypot(p.ax - b.x, p.ay - b.y);
                let hidden = G.obstacles.some(o => Math.hypot(o.x - p.ax, o.y - p.ay) < 50);
                if (dist < ARENA_R * 0.35 && !hidden) { p.hp -= 25; b.successFaceTimer = 1.0; }
                b.currentAttack = null;
            }
        }
        if (G.arenaDarkness > 0 && b.currentAttack !== "darkness") G.arenaDarkness -= dt * 0.25;
    }

    for (let m of G.miniCopies) {
        let dist = Math.hypot(p.ax - m.x, p.ay - m.y);
        let mspeed = m.kind === "mini_ballerina" ? 3.4 : 1.8;
        if (dist > 10) { m.x += (p.ax - m.x)/dist*mspeed; m.y += (p.ay - m.y)/dist*mspeed; }
        if (m.kind === "mini_clown") {
            m.noseCd -= dt;
            if (m.noseCd <= 0 && dist < 420) {
                let ang = Math.atan2(p.ay - m.y, p.ax - m.x);
                G.enemyProj.push({ x:m.x, y:m.y, vx:Math.cos(ang)*5, vy:Math.sin(ang)*5, dmg:6, life:2.5, kind:"nose", dead:false });
                m.noseCd = 4.0;
            }
        }
        if (m.kind === "mini_dancer") {
            m.healCd -= dt; if (m.healCd <= 0) { if (b.alive) b.hp = Math.min(b.maxHp, b.hp + 20); spawnBurst(m.x, m.y, "#3eff9e"); m.healCd = 5.0; }
        }
        if (dist < 32 && m.cd <= 0) { p.hp -= 4; sfx.robotAtk(); m.cd = 1.4; b.successFaceTimer = 1.0; }
        if (m.cd > 0) m.cd -= dt;
    }

    for (let v of G.vents) {
        if (v.active) {
            v.timer -= dt; if (v.timer <= 0) v.active = false;
            if (Math.hypot(p.ax - v.x, p.ay - v.y) < v.r + 18) { p.hp -= 12.0 * dt; p.poisonTimer = 1.5; }
        }
    }

    if (G.screenShake > 0) G.screenShake -= dt * 4;
    if (p.hp <= 0) { p.hp = p.maxHp * 0.5; p.ax = 0; p.ay = 220; showMessage("КРИТИЧЕСКИЙ СБОЙ. ВОССТАНОВЛЕНИЕ СИСТЕМ.", 1.5); }
    
    if (b.hp <= 0 && b.alive) {
        b.alive = false; spawnBurst(b.x, b.y, "#ffcf3f", 90);
        for(let i=0; i<3; i++) {
            let ang = -Math.PI/2 + (i-1)*0.9;
            G.portals.push({ x: Math.cos(ang)*ARENA_R*0.5, y: Math.sin(ang)*ARENA_R*0.5, id: i, spin: 0 });
        }
        sfx.portal(); showMessage("DQOPD ИЗГНАН ИЗ КИБЕР-ТЕАТРА! ВЫБЕРИТЕ ВРАТА", 4.0);
    }

    if (!b.alive) {
        for(let port of G.portals) {
            port.spin += dt * 2;
            if (I.interact && Math.hypot(p.ax - port.x, p.ay - port.y) < 70) {
                G.state = "END"; G.endAlpha = 0;
                let worlds = ["КОСМОСА", "ОКЕАНА", "ПУСТЫНИ"];
                G.endText = `ВЫ ВОШЛИ В ПОРТАЛ ${worlds[port.id]}!\nКОНЕЦ ИГРЫ. Продолжение следует...\nСпасибо за игру!`;
            }
        }
        I.interact = false;
    }
}

function drawShadow(x, y, w) {
    ctx.beginPath();
    ctx.ellipse(x, y - 6, w * 0.55, 8, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
    ctx.fill();
}

function drawPlayerGraphics(sx, sy, w, h, facing, t, muzzle, hpRatio) {
    let bob = Math.sin(t * 8) * 2; sy += bob;
    drawShadow(sx, sy + h * 0.5, w);
    
    let base = "#e8e8f0"; let legC = "#b0b0b8";
    ctx.fillStyle = legC;
    ctx.fillRect(sx - w*0.30, sy + h*0.14, w*0.24, h*0.34);
    ctx.fillRect(sx + w*0.06, sy + h*0.14, w*0.24, h*0.34);
    
    drawVGradient(sx - w*0.5, sy - h*0.34, w, h*0.5, "#ffffff", "#b0b0b8", 8);
    ctx.fillStyle = "#ff5a3c";
    ctx.beginPath(); ctx.arc(sx - w*0.16, sy - h*0.06, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + w*0.02, sy - h*0.06, 4, 0, Math.PI*2); ctx.fill();

    let visorX = sx - w * 0.32, visorY = sy - h * 0.64, visorW = w * 0.64, visorH = h * 0.30;
    drawVGradient(visorX, visorY, visorW, visorH, "#5a3e28", "#2e1e12", 10);
    
    let ex = sx + (facing > 0 ? w * 0.12 : -w * 0.12);
    ctx.fillStyle = hpRatio > 0.3 ? "#ffffcc" : "#ff5a5a";
    ctx.beginPath(); ctx.arc(ex, sy - h * 0.49, 6, 0, Math.PI*2); ctx.fill();

    let blasterCol = muzzle ? "#ffff8c" : "#6e96e6";
    ctx.fillStyle = blasterCol;
    let bx = facing > 0 ? sx + w*0.46 : sx - w*0.46 - 30;
    ctx.fillRect(bx, sy - h*0.30, 30, 14);
}

function drawRobotGraphics(sx, sy, w, h, kind, t, facing, hpRatio) {
    let bob = Math.sin(t * 8 + sx * 0.02) * 2; sy += bob;
    drawShadow(sx, sy + h * 0.5, w);
    
    if (kind === "ballerina") {
        drawVGradient(sx - w*0.32, sy - h*0.48, w*0.64, h*0.34, "#e6e6ed", "#bcbcc8", 6);
        ctx.fillStyle = "#3fc8ff";
        ctx.beginPath(); ctx.arc(sx, sy - h * 0.31, 5, 0, Math.PI*2); ctx.fill();
    } else if (kind === "clown") {
        drawVGradient(sx - w*0.5, sy - h*0.32, w, h*0.46, "#00ffcd", "#00a08c", 6);
        ctx.fillStyle = "#ff3c3c";
        ctx.beginPath(); ctx.arc(sx, sy - h * 0.32, 7, 0, Math.PI*2); ctx.fill();
    } else {
        drawVGradient(sx - w*0.5, sy - h*0.32, w, h*0.46, "#aab0ba", "#6e7480", 6);
    }
    
    if (hpRatio < 1.0) {
        let bw = w * 0.8;
        ctx.fillStyle = "#280000"; ctx.fillRect(sx - bw/2, sy - h*0.75, bw, 5);
        ctx.fillStyle = "#50f05a"; ctx.fillRect(sx - bw/2, sy - h*0.75, bw * Math.max(0, hpRatio), 5);
    }
}

function drawArcadeCabinet(sx, sy, t) {
    ctx.fillStyle = "#232337"; ctx.fillRect(sx - 22, sy - 60, 44, 70);
    let glow = `rgb(${Math.floor(60 + 40 * Math.sin(t*3 + sx))}, 200, 255)`;
    ctx.fillStyle = glow; ctx.fillRect(sx - 16, sy - 52, 32, 22);
}

// Клик по меню
window.addEventListener('click', e => {
    if(G.state !== "MENU") return;
    let rect = canvas.getBoundingClientRect();
    let mx = e.clientX - rect.left;
    let my = e.clientY - rect.top;
    
    for(let target in menuButtons) {
        let b = menuButtons[target];
        if(mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
            if(target === "PATH") { generatePath(); G.state = "PATH"; showMessage("ФАЗА 1: ПУТЬ К КИБЕР-ТЕАТРУ", 2.2); }
            else { G.state = target; }
            break;
        }
    }
});

function drawPathScreen() {
    ctx.fillStyle = "#080812"; ctx.fillRect(0,0,WIDTH,HEIGHT);
    
    // Отрисовка пола
    ctx.fillStyle = "#181b2e"; ctx.fillRect(0, GROUND_Y, WIDTH, HEIGHT - GROUND_Y);
    
    // Декорация аркад на старте
    if(G.camX < 0) {
        for(let cx = WORLD_START + 80; cx < -80; cx += 160) { drawArcadeCabinet(cx - G.camX, GROUND_Y, G.t); }
    }

    // Кислотные лужи
    for(let pool of G.acidPool) {
        ctx.beginPath(); ctx.ellipse(pool.x - G.camX, GROUND_Y - 4, pool.r, 8, 0, 0, Math.PI*2);
        ctx.fillStyle = "rgba(0, 255, 68, 0.4)"; ctx.fill();
    }
    
    // Вражеские пули
    for (let pr of G.enemyProj) { ctx.fillStyle = "#00ff44"; ctx.beginPath(); ctx.arc(pr.x - G.camX, GROUND_Y + pr.y, 6, 0, Math.PI*2); ctx.fill(); }

    // Острова
    for(let isl of G.islands) {
        let sx = isl.x - G.camX;
        drawVGradient(sx - isl.rx, GROUND_Y - isl.ry, isl.rx * 2, isl.ry * 2, "#503e28", "#282014", 50);
        
        for (let m of isl.machines) {
            let mx = sx + m.ox, my = GROUND_Y + m.oy;
            ctx.fillStyle = "#121212"; ctx.fillRect(mx - 18, my - 40, 36, 54);
            ctx.fillStyle = m.cooldown <= 0 ? m.col : "#323232"; ctx.fillRect(mx - 13, my - 33, 26, 22);
            drawText(`${m.cost}`, 14, "#ffffff", mx, my + 22, true, false);
        }
        
        if (isl.domeOn) {
            ctx.strokeStyle = `rgba(63, 207, 255, ${0.5 + 0.2*Math.sin(G.t*8)})`; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.ellipse(sx, GROUND_Y - isl.ry, isl.rx + 10, isl.ry + 20, 0, 0, Math.PI*2); ctx.stroke();
        }
    }

    // Враги
    for(let r of G.robots) {
        drawRobotGraphics(r.x - G.camX, GROUND_Y + r.y, r.w, r.h, r.kind, G.t, r.vx >= 0 ? 1 : -1, r.hp / r.maxHp);
    }

    // Игрок
    let p = G.player;
    drawPlayerGraphics(p.x - G.camX, GROUND_Y + p.y + p.hopY, p.w, p.h, I.facing, G.t, p.fireCd > 0.12, p.hp / p.maxHp);

    // Снаряды игрока
    ctx.fillStyle = "#ff4646";
    for(let l of G.lasers) { ctx.fillRect(l.x - G.camX - 8, GROUND_Y + l.y - 16, 16, 5); }

    // Прогресс
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(WIDTH//2 - 130, 10, 260, 10);
    let prog = clamp((p.x - WORLD_START) / (WORLD_LENGTH - WORLD_START), 0, 1);
    ctx.fillStyle = "#78ff3f"; ctx.fillRect(WIDTH//2 - 128, 12, 256 * prog, 6);
}

function drawArenaScreen() {
    let p = G.player; let b = G.boss;
    let shakeX = (Math.random() * G.screenShake * 5);
    let shakeY = (Math.random() * G.screenShake * 5);
    let offX = WIDTH / 2 + shakeX - p.ax;
    let offY = HEIGHT / 2 + shakeY - p.ay;

    ctx.fillStyle = "#0c0612"; ctx.fillRect(0,0,WIDTH,HEIGHT);
    
    // Сама арена
    ctx.fillStyle = "#231230"; ctx.beginPath(); ctx.arc(offX, offY, ARENA_R, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#ffcf3f"; ctx.lineWidth = 6; ctx.stroke();

    // Клапаны вентиляции
    for(let v of G.vents) {
        ctx.fillStyle = v.active ? "#ff143c" : "#3c3c3c";
        ctx.beginPath(); ctx.arc(v.x + offX, v.y + offY, v.r, 0, Math.PI*2); ctx.fill();
    }

    // Препятствия
    for(let obs of G.obstacles) {
        drawVGradient(obs.x + offX - obs.w/2, obs.y + offY - obs.h/2, obs.w, obs.h, "#6e5438", "#46321e");
    }

    // Босс
    if (b && b.alive) {
        let sx = b.x + offX, sy = b.y + offY;
        ctx.fillStyle = "#3c424e"; ctx.fillRect(sx - 40, sy - 46, 80, 74); // Тело
        ctx.fillStyle = "#1a1a20"; ctx.fillRect(sx - 48, sy - 128, 96, 66); // Голова-ТВ
        
        if (b.stunTimer > 0) {
            ctx.fillStyle = G.t % 0.2 > 0.1 ? "#ff3232" : "#32ff32"; ctx.fillRect(sx - 42, sy - 122, 84, 52);
        } else {
            ctx.fillStyle = "#08080c"; ctx.fillRect(sx - 42, sy - 122, 84, 52);
            drawText(b.successFaceTimer > 0 ? "O_O" : "◡", 20, "#1cff6a", sx, sy - 96, true);
        }
    }

    // Порталы в конце
    for(let port of G.portals) {
        let px = port.x + offX, py = port.y + offY;
        ctx.fillStyle = ["#3fcfff", "#3fff9e", "#ffcf3f"][port.id];
        ctx.beginPath(); ctx.arc(px, py, 40, 0, Math.PI*2); ctx.fill();
        drawText(["КОСМОС", "ОКЕАН", "ПУСТЫНЯ"][port.id], 14, "#ffffff", px, py + 55, true);
    }

    // Игрок и лазеры
    drawPlayerGraphics(p.ax + offX, p.ay + offY, p.w, p.h, I.facing, G.t, p.fireCd > 0.12, p.hp / p.maxHp);
    ctx.fillStyle = "#ff4646";
    for(let l of G.lasers) { ctx.fillRect(l.x + offX - 6, l.y + offY - 3, 12, 5); }
    
    // Вражеские снаряды на арене
    for(let pr of G.enemyProj) {
        ctx.fillStyle = pr.kind === "nose" ? "#ff3c3c" : "#ffffff";
        ctx.beginPath(); ctx.arc(pr.x + offX, pr.y + offY, 6, 0, Math.PI*2); ctx.fill();
    }
}

let lastTime = performance.now();
function gameLoop(now) {
    let dt = (now - lastTime) / 1000.0;
    lastTime = now;
    if (dt > 0.05) dt = 0.05;

    G.t += dt;
    if (G.messageTimer > 0) G.messageTimer -= dt;

    pollInput();

    if (G.state === "MENU") { drawMenu(); }
    else if (G.state === "LORE") { drawLore(); }
    else if (G.state === "SETTINGS") { drawSettings(); }
    else if (G.state === "PATH") {
        updateMusic(dt);
        updatePath(dt);
        drawPathScreen();
        drawHUD();
        drawCardPopupOverlay();
    } else if (G.state === "ARENA") {
        updateMusic(dt);
        updateArena(dt);
        drawArenaScreen();
        drawHUD();
    } else if (G.state === "END") {
        drawEnd();
    }

    requestAnimationFrame(gameLoop);
}

// Запуск цикла
requestAnimationFrame(gameLoop);
</script>
